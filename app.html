<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Pi PaaS - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- CDNs React & Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

  <!-- Tailwind CSS & FontAwesome pour les icônes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold:  { 300: '#f6d488', 400: '#eec577', 500: '#e3b559', 600: '#c99a3f', 700: '#a67e2f' },
            jade:  { 400: '#5fe0ac', 500: '#34c98f', 600: '#279e70' },
            ember: { 400: '#f0797d', 500: '#e5484d', 600: '#c93c40' },
            azur:  { 300: '#a8dcef', 400: '#7ec8e3' },
            dark:  { 950: '#05070a', 900: '#0a0e13', 800: '#12171e', 700: '#1a212a', 600: '#242c37' }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --gold: #e3b559; --gold-2: #f6d488;
      --green: #34c98f; --green-2: #5fe0ac;
      --red: #e5484d;
      --border: #242c37;
    }
    body { font-family: 'Inter', 'Segoe UI', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-title { font-family: 'Cinzel', 'Segoe UI', serif; letter-spacing: .3px; }

    /* ---- Fond ambiant : deux lueurs douces, or & émeraude, purement décoratives ---- */
    #fond-royaume { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #05070a; }
    #fond-royaume::before, #fond-royaume::after {
      content:""; position:absolute; border-radius:50%; filter: blur(90px); opacity:.5;
      animation: royaume-derive 26s ease-in-out infinite alternate;
    }
    #fond-royaume::before {
      width:55vw; height:55vw; max-width:760px; max-height:760px; top:-16%; left:-10%;
      background: radial-gradient(circle, rgba(227,181,89,0.20), transparent 70%);
    }
    #fond-royaume::after {
      width:50vw; height:50vw; max-width:700px; max-height:700px; bottom:-18%; right:-8%;
      background: radial-gradient(circle, rgba(52,201,143,0.14), transparent 70%);
      animation-delay: -9s;
    }
    @keyframes royaume-derive { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(3%, 4%) scale(1.08); } }

    /* ---- Carte à liseré doré : même signature visuelle que le site d'admin ---- */
    .card-royaume {
      position: relative; overflow: hidden;
      background: linear-gradient(180deg, #12171e, #12171e 60%, #1a212a);
      border: 1px solid var(--border); box-shadow: 0 12px 34px -14px rgba(0,0,0,0.75);
      transition: border-color .2s ease, transform .15s ease-out;
    }
    .card-royaume::before {
      content:""; position:absolute; inset:0 0 auto 0; height:2px;
      background: linear-gradient(90deg, transparent, rgba(227,181,89,0.55), rgba(52,201,143,0.4), transparent);
    }
    .card-royaume:hover { border-color:#33404d; }

    /* ---- Boutons ---- */
    .btn-or {
      background: linear-gradient(135deg, var(--gold-2), var(--gold)); color:#1b1406; font-weight:700;
      box-shadow: 0 6px 16px -6px rgba(232,189,85,0.5);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .btn-or:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.05); box-shadow:0 10px 20px -6px rgba(232,189,85,0.6); }
    .btn-or:active:not(:disabled) { transform:translateY(0); }
    .btn-or:disabled { opacity:.5; cursor:default; }

    .btn-fantome {
      background:#1a212a; border:1px solid var(--border); color:#f3f5f7; font-weight:600;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn-fantome:hover:not(:disabled) { background:#242c37; }
    .btn-fantome:disabled { opacity:.5; cursor:default; }

    .btn-peril {
      background: linear-gradient(135deg, rgba(240,121,125,0.16), rgba(229,72,77,0.14));
      border:1px solid rgba(229,72,77,0.3); color:#ffa3a6; font-weight:700;
      transition: filter .12s ease;
    }
    .btn-peril:hover:not(:disabled) { filter:brightness(1.15); }
    .btn-peril:disabled { opacity:.5; cursor:default; }

    /* ---- Champs ---- */
    .champ-royaume {
      background:#05070a; border:1px solid var(--border); color:#f3f5f7;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .champ-royaume:focus { outline:none; border-color: var(--gold); box-shadow:0 0 0 3px rgba(232,189,85,0.15); }

    /* ---- Pastille "en ligne" qui pulse (statut running) ---- */
    .pouls-jade { animation: pouls-jade-anim 1.8s ease-in-out infinite; }
    @keyframes pouls-jade-anim {
      0% { box-shadow:0 0 0 0 rgba(52,201,143,0.55); }
      70% { box-shadow:0 0 0 8px rgba(52,201,143,0); }
      100% { box-shadow:0 0 0 0 rgba(52,201,143,0); }
    }
    @media (prefers-reduced-motion: reduce) { .pouls-jade, #fond-royaume::before, #fond-royaume::after { animation:none; } }

    ::-webkit-scrollbar { width:10px; height:10px; }
    ::-webkit-scrollbar-thumb { background:#242c37; border-radius:10px; }
    ::-webkit-scrollbar-track { background:transparent; }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen selection:bg-gold-500 selection:text-black flex flex-col">
  <div id="fond-royaume"></div>
  <div id="root" class="flex flex-col min-h-screen"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;

    const STATUS_META = {
      running:   { color: "bg-jade-500", text: "text-jade-400",  border: "border-jade-500/30",  bg: "bg-jade-500/10",  label: "En ligne",     pulse: true },
      stopped:   { color: "bg-slate-500", text: "text-slate-400", border: "border-slate-500/30", bg: "bg-slate-500/10", label: "Arrêté" },
      error:     { color: "bg-ember-500", text: "text-ember-400", border: "border-ember-500/30", bg: "bg-ember-500/10", label: "Erreur" },
      deploying: { color: "bg-gold-500",  text: "text-gold-300",  border: "border-gold-500/30",  bg: "bg-gold-500/10",  label: "Déploiement" },
    };

    const emptyForm = { name: "", repo_url: "", branch: "main", start_command: "", port: "", autoupdate: true };

    function PiPaasDashboard() {
      const [apiInput, setApiInput] = useState("http://192.168.1.10:8000");
      const [apiBase, setApiBase] = useState("");
      const [connected, setConnected] = useState(false);
      const [connecting, setConnecting] = useState(false);
      const [connectError, setConnectError] = useState("");
      const [projects, setProjects] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [logs, setLogs] = useState("");
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(emptyForm);
      const [formError, setFormError] = useState("");
      const [busy, setBusy] = useState(false);
      const [envRows, setEnvRows] = useState([]);
      const [envSaved, setEnvSaved] = useState(true);
      const [showEnvValues, setShowEnvValues] = useState(false);
      const logsRef = useRef(null);

      const selected = projects.find((p) => p.id === selectedId) || null;

      const fetchProjects = useCallback(async (base) => {
        try {
          const res = await fetch(`${base}/projects`);
          if (!res.ok) throw new Error("bad response");
          const data = await res.json();
          setProjects(data);
          setConnected(true);
          setConnectError("");
          return data;
        } catch (e) {
          setConnected(false);
          setConnectError("Impossible de joindre le backend à cette adresse.");
          return null;
        }
      }, []);

      const fetchLogs = useCallback(async (base, id) => {
        try {
          const res = await fetch(`${base}/projects/${id}/logs?lines=200`);
          const text = await res.text();
          setLogs(text);
        } catch (e) {
          setLogs("Impossible de récupérer les logs.");
        }
      }, []);

      useEffect(() => {
        if (!connected || !apiBase) return;
        const interval = setInterval(() => fetchProjects(apiBase), 8000);
        return () => clearInterval(interval);
      }, [connected, apiBase, fetchProjects]);

      useEffect(() => {
        if (selected && connected) {
          fetchLogs(apiBase, selected.id);
          const interval = setInterval(() => fetchLogs(apiBase, selected.id), 5000);
          return () => clearInterval(interval);
        }
      }, [selected?.id, connected, apiBase, fetchLogs]);

      useEffect(() => {
        if (selected) {
          setEnvRows(Object.entries(selected.env_vars || {}).map(([key, value]) => ({ key, value })));
          setEnvSaved(true);
        }
      }, [selected?.id]);

      useEffect(() => {
        if (logsRef.current) logsRef.current.scrollTop = logsRef.current.scrollHeight;
      }, [logs]);

      async function handleConnect() {
        setConnecting(true);
        const base = apiInput.replace(/\/$/, "");
        const data = await fetchProjects(base);
        setApiBase(base);
        if (data && data.length > 0 && !selectedId) setSelectedId(data[0].id);
        setConnecting(false);
      }

      async function handleCreate(e) {
        e.preventDefault();
        setFormError("");
        if (!form.name || !form.repo_url || !form.start_command || !form.port) {
          setFormError("Tous les champs sauf la branche sont requis.");
          return;
        }
        setBusy(true);
        try {
          const res = await fetch(`${apiBase}/projects`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...form, port: parseInt(form.port, 10) }),
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Échec de la création");
          }
          const created = await res.json();
          await fetchProjects(apiBase);
          setSelectedId(created.id);
          setShowForm(false);
          setForm(emptyForm);
        } catch (err) {
          setFormError(err.message);
        } finally {
          setBusy(false);
        }
      }

      async function handleAction(action) {
        if (!selected) return;
        setBusy(true);
        try {
          await fetch(`${apiBase}/projects/${selected.id}/${action}`, { method: "POST" });
          await fetchProjects(apiBase);
          if (action === "deploy") await fetchLogs(apiBase, selected.id);
        } finally {
          setBusy(false);
        }
      }

      async function handleDelete() {
        if (!selected) return;
        setBusy(true);
        try {
          await fetch(`${apiBase}/projects/${selected.id}`, { method: "DELETE" });
          setSelectedId(null);
          await fetchProjects(apiBase);
        } finally {
          setBusy(false);
        }
      }

      function updateEnvRow(i, field, value) {
        const next = [...envRows];
        next[i] = { ...next[i], [field]: value };
        setEnvRows(next);
        setEnvSaved(false);
      }
      function addEnvRow() { setEnvRows([...envRows, { key: "", value: "" }]); setEnvSaved(false); }
      function removeEnvRow(i) { setEnvRows(envRows.filter((_, idx) => idx !== i)); setEnvSaved(false); }

      async function saveEnvVars() {
        if (!selected) return;
        const env_vars = {};
        envRows.forEach((row) => { if (row.key) env_vars[row.key] = row.value; });
        setBusy(true);
        try {
          await fetch(`${apiBase}/projects/${selected.id}/env`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ env_vars }),
          });
          await fetchProjects(apiBase);
          setEnvSaved(true);
        } finally {
          setBusy(false);
        }
      }

      return (
        <div class="flex flex-col flex-1 min-h-screen">
          {/* Navigation Barre Haute */}
          <header class="border-b border-gold-500/10 bg-dark-900/70 backdrop-blur-xl sticky top-0 z-40 px-6 py-3 flex items-center justify-between flex-wrap gap-4 shadow-[0_8px_30px_-16px_rgba(0,0,0,0.9)]">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 flex items-center justify-center bg-gradient-to-br from-gold-300 to-gold-600 shadow-lg shadow-gold-500/20" style={{ clipPath: "polygon(50% 0%, 100% 16%, 100% 60%, 50% 100%, 0% 60%, 0% 16%)" }}>
                <i class="fa-solid fa-microchip text-[#1b1406] text-base"></i>
              </div>
              <span class="font-title font-800 text-lg tracking-wide text-white">
                Pi PaaS <span class="text-xs text-gold-300 font-mono px-2 py-0.5 rounded-full bg-gold-500/10 border border-gold-500/25">v0.1.0</span>
              </span>
            </div>

            <div class="flex items-center gap-2">
              <span class={`w-2.5 h-2.5 rounded-full ${connected ? 'bg-jade-500 pouls-jade' : 'bg-slate-600'}`}></span>
              <input
                type="text"
                value={apiInput}
                onChange={(e) => setApiInput(e.target.value)}
                placeholder="http://192.168.1.10:8000"
                class="champ-royaume text-xs font-mono rounded-lg px-3 py-1.5 w-60"
              />
              <button
                onClick={handleConnect}
                disabled={connecting}
                class="btn-or text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5"
              >
                {connecting ? <i class="fa-solid fa-spinner animate-spin"></i> : <i class="fa-solid fa-plug"></i>}
                {connecting ? "..." : connected ? "Reconnecter" : "Connecter"}
              </button>
            </div>
          </header>

          {connectError && !connected && (
            <div class="bg-ember-500/10 border-b border-ember-500/20 text-ember-400 text-xs px-6 py-2.5 text-center font-mono flex items-center justify-center gap-2">
              <i class="fa-solid fa-triangle-exclamation"></i> {connectError}
            </div>
          )}

          {/* Contenu Principal */}
          <div class="flex flex-1 min-h-0">
            {/* Sidebar Projets */}
            <aside class="w-64 border-r border-dark-600 bg-dark-900/40 p-4 flex flex-col shrink-0">
              <div class="flex items-center justify-between pb-4 border-b border-dark-600 mb-3">
                <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Projets</span>
                <button
                  onClick={() => { setShowForm(true); setFormError(""); }}
                  class="w-7 h-7 bg-gold-500/15 border border-gold-500/30 text-gold-300 hover:bg-gold-500 hover:text-[#1b1406] rounded-lg flex items-center justify-center transition"
                  title="Ajouter un projet"
                >
                  <i class="fa-solid fa-plus text-xs"></i>
                </button>
              </div>

              {!connected && <p class="text-xs text-slate-500 py-4 text-center">Connecte-toi à ton Pi pour charger la liste.</p>}
              {connected && projects.length === 0 && (
                <p class="text-xs text-slate-500 py-4 text-center">Aucun projet configuré.</p>
              )}

              <div class="space-y-1.5 overflow-y-auto">
                {projects.map((p) => {
                  const meta = STATUS_META[p.status] || STATUS_META.stopped;
                  const isSelected = p.id === selectedId;
                  return (
                    <button
                      key={p.id}
                      onClick={() => setSelectedId(p.id)}
                      class={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium transition text-left ${
                        isSelected
                          ? 'bg-gold-500/10 border border-gold-500/30 text-white shadow-sm'
                          : 'text-slate-400 hover:bg-dark-700/60 hover:text-slate-200 border border-transparent'
                      }`}
                    >
                      <span class={`w-2 h-2 rounded-full ${meta.color} ${meta.pulse ? 'pouls-jade' : ''}`}></span>
                      <span class="truncate flex-1">{p.name}</span>
                      {p.exposed && <i class="fa-solid fa-globe text-jade-400 text-[10px]" title="Exposé"></i>}
                      <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                    </button>
                  );
                })}
              </div>
            </aside>

            {/* Zone de Vue Détaillée */}
            <main class="flex-1 p-8 overflow-y-auto">
              {!selected && (
                <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-dark-800 border border-dark-600 flex items-center justify-center">
                    <i class="fa-solid fa-server text-slate-600 text-xl"></i>
                  </div>
                  <p class="text-sm max-w-xs">
                    {connected ? "Sélectionne un projet à gauche pour afficher ses détails." : "Renseigne l'URL de ton API et connecte-toi."}
                  </p>
                </div>
              )}

              {selected && (
                <div class="space-y-6 max-w-5xl mx-auto">
                  {/* Header Projet */}
                  <div class="flex items-start justify-between flex-wrap gap-4 border-b border-dark-600 pb-6">
                    <div>
                      <h1 class="font-title text-2xl font-800 text-white tracking-tight">{selected.name}</h1>
                      <div class="flex items-center gap-3 mt-2 text-xs text-slate-400 font-mono">
                        <span class="flex items-center gap-1"><i class="fa-solid fa-code-branch text-azur-400"></i> {selected.branch}</span>
                        <span>•</span>
                        <span>Port {selected.port}</span>
                        <span>•</span>
                        <span class="bg-dark-700 text-slate-300 px-2 py-0.5 rounded">
                          {selected.last_commit ? selected.last_commit.slice(0, 7) : "Non déployé"}
                        </span>
                      </div>
                    </div>

                    <div class="flex items-center gap-2">
                      {(() => {
                        const meta = STATUS_META[selected.status] || STATUS_META.stopped;
                        return (
                          <div class={`px-3 py-1 rounded-full text-xs font-semibold border flex items-center gap-2 ${meta.bg} ${meta.text} ${meta.border}`}>
                            <span class={`w-2 h-2 rounded-full ${meta.color} ${meta.pulse ? 'pouls-jade' : ''}`}></span>
                            {meta.label}
                          </div>
                        );
                      })()}

                      {selected.exposed && (
                        <div class="px-3 py-1 rounded-full text-xs font-semibold bg-jade-500/10 text-jade-400 border border-jade-500/20 flex items-center gap-1.5">
                          <i class="fa-solid fa-globe text-[11px]"></i> Public
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Boutons d'Action */}
                  <div class="flex flex-wrap items-center gap-3">
                    <button
                      onClick={() => handleAction("deploy")}
                      disabled={busy}
                      class="btn-or px-4 py-2 rounded-xl text-xs flex items-center gap-2"
                    >
                      <i class="fa-solid fa-rotate mr-1"></i> Déployer
                    </button>

                    <button
                      onClick={() => handleAction("stop")}
                      disabled={busy || selected.status === "stopped"}
                      class="btn-fantome px-4 py-2 rounded-xl text-xs flex items-center gap-2"
                    >
                      <i class="fa-solid fa-stop text-gold-300"></i> Arrêter
                    </button>

                    {selected.exposed ? (
                      <button
                        onClick={() => handleAction("unexpose")}
                        disabled={busy}
                        class="btn-fantome px-4 py-2 rounded-xl text-xs flex items-center gap-2"
                      >
                        <i class="fa-solid fa-eye-slash text-slate-400"></i> Masquer du proxy
                      </button>
                    ) : (
                      <button
                        onClick={() => handleAction("expose")}
                        disabled={busy || selected.status !== "running"}
                        class="btn-fantome px-4 py-2 rounded-xl text-xs flex items-center gap-2"
                      >
                        <i class="fa-solid fa-globe text-jade-400"></i> Exposer publiquement
                      </button>
                    )}

                    <button
                      onClick={handleDelete}
                      disabled={busy}
                      class="btn-peril ml-auto px-4 py-2 rounded-xl text-xs flex items-center gap-2"
                    >
                      <i class="fa-solid fa-trash"></i> Supprimer
                    </button>
                  </div>

                  {/* Métadonnées (Repo & Command) */}
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="card-royaume rounded-xl p-4">
                      <p class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Dépôt Git</p>
                      <p class="text-xs font-mono text-gold-300 truncate">{selected.repo_url}</p>
                    </div>

                    <div class="card-royaume rounded-xl p-4">
                      <p class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Commande de Démarrage</p>
                      <p class="text-xs font-mono text-slate-200 bg-dark-950 p-2 rounded-lg border border-dark-600">{selected.start_command}</p>
                    </div>
                  </div>

                  {/* Variables d'Environnement */}
                  <div class="card-royaume rounded-2xl p-5 space-y-4">
                    <div class="flex items-center justify-between">
                      <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-gold-400"></i> Variables d'environnement
                      </h3>
                      <div class="flex items-center gap-2">
                        <button
                          onClick={() => setShowEnvValues(!showEnvValues)}
                          class="p-1.5 text-xs text-slate-400 hover:text-slate-200 transition"
                          title="Afficher/Masquer les valeurs"
                        >
                          <i class={`fa-solid ${showEnvValues ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                        </button>
                        <button
                          onClick={addEnvRow}
                          class="btn-fantome px-2.5 py-1 rounded-lg text-xs"
                        >
                          <i class="fa-solid fa-plus mr-1"></i> Ajouter
                        </button>
                      </div>
                    </div>

                    {envRows.length === 0 && <p class="text-xs text-slate-500 font-mono">Aucune variable définie pour le moment.</p>}

                    <div class="space-y-2">
                      {envRows.map((row, i) => (
                        <div key={i} class="flex items-center gap-2">
                          <input
                            type="text"
                            value={row.key}
                            onChange={(e) => updateEnvRow(i, "key", e.target.value)}
                            placeholder="CLE"
                            class="champ-royaume text-gold-300 text-xs font-mono rounded-lg px-3 py-2 w-1/3"
                          />
                          <input
                            type={showEnvValues ? "text" : "password"}
                            value={row.value}
                            onChange={(e) => updateEnvRow(i, "value", e.target.value)}
                            placeholder="valeur"
                            class="champ-royaume text-slate-200 text-xs font-mono rounded-lg px-3 py-2 flex-1"
                          />
                          <button onClick={() => removeEnvRow(i)} class="p-2 text-slate-500 hover:text-ember-400 transition bg-transparent border-none shadow-none">
                            <i class="fa-solid fa-xmark"></i>
                          </button>
                        </div>
                      ))}
                    </div>

                    {envRows.length > 0 && (
                      <button
                        onClick={saveEnvVars}
                        disabled={envSaved || busy}
                        class={`mt-2 px-4 py-2 text-xs font-semibold rounded-xl transition ${
                          envSaved
                            ? 'bg-dark-700/50 text-slate-500 cursor-default'
                            : 'btn-or'
                        }`}
                      >
                        {envSaved ? "Enregistré" : "Sauvegarder les variables"}
                      </button>
                    )}
                  </div>

                  {/* Module de Logs Console */}
                  <div class="card-royaume rounded-2xl p-5 space-y-3">
                    <div class="flex items-center justify-between border-b border-dark-600 pb-3">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2 font-mono">
                        <i class="fa-solid fa-terminal text-gold-400"></i> Logs d'exécution
                      </span>
                      <button onClick={() => fetchLogs(apiBase, selected.id)} class="text-xs text-slate-400 hover:text-gold-300 transition bg-transparent border-none shadow-none p-0">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Actualiser
                      </button>
                    </div>
                    <div ref={logsRef} class="h-64 overflow-y-auto font-mono text-xs text-slate-300 leading-relaxed whitespace-pre-wrap bg-dark-950 p-4 rounded-xl border border-dark-600">
                      {logs || "Aucun log à afficher pour l'instant."}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Modale de Création de Projet */}
          {showForm && (
            <div class="fixed inset-0 bg-dark-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setShowForm(false)}>
              <div class="card-royaume rounded-2xl w-full max-w-md p-6 shadow-2xl relative" onClick={(e) => e.stopPropagation()}>
                <div class="flex items-center justify-between pb-4 border-b border-dark-600 mb-4">
                  <h3 class="font-title text-base font-800 text-white">Nouveau projet</h3>
                  <button onClick={() => setShowForm(false)} class="text-slate-400 hover:text-white transition bg-transparent border-none shadow-none p-0">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleCreate} class="space-y-4 text-xs">
                  <div>
                    <label class="block text-slate-300 mb-1">Nom du projet</label>
                    <input
                      type="text"
                      value={form.name}
                      onChange={(e) => setForm({ ...form, name: e.target.value })}
                      placeholder="mon-site"
                      class="champ-royaume w-full rounded-xl px-3.5 py-2.5 font-mono"
                    />
                  </div>

                  <div>
                    <label class="block text-slate-300 mb-1">URL du dépôt GitHub</label>
                    <input
                      type="text"
                      value={form.repo_url}
                      onChange={(e) => setForm({ ...form, repo_url: e.target.value })}
                      placeholder="https://github.com/user/repo.git"
                      class="champ-royaume w-full rounded-xl px-3.5 py-2.5 font-mono"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-slate-300 mb-1">Branche</label>
                      <input
                        type="text"
                        value={form.branch}
                        onChange={(e) => setForm({ ...form, branch: e.target.value })}
                        class="champ-royaume w-full rounded-xl px-3.5 py-2.5 font-mono"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-300 mb-1">Port</label>
                      <input
                        type="text"
                        value={form.port}
                        onChange={(e) => setForm({ ...form, port: e.target.value })}
                        placeholder="8001"
                        class="champ-royaume w-full rounded-xl px-3.5 py-2.5 font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block text-slate-300 mb-1">Commande de démarrage</label>
                    <input
                      type="text"
                      value={form.start_command}
                      onChange={(e) => setForm({ ...form, start_command: e.target.value })}
                      placeholder="python3 main.py"
                      class="champ-royaume w-full rounded-xl px-3.5 py-2.5 font-mono"
                    />
                  </div>

                  <label class="flex items-center gap-2 cursor-pointer pt-1">
                    <input
                      type="checkbox"
                      checked={form.autoupdate}
                      onChange={(e) => setForm({ ...form, autoupdate: e.target.checked })}
                      class="rounded bg-dark-950 border-dark-600 text-gold-500 focus:ring-0"
                    />
                    <span class="text-slate-400">Redéployer automatiquement sur chaque push</span>
                  </label>

                  {formError && <p class="text-ember-400 text-xs font-mono">{formError}</p>}

                  <button
                    type="submit"
                    disabled={busy}
                    class="btn-or w-full py-3 rounded-xl text-xs mt-2"
                  >
                    Cloner et ajouter
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PiPaasDashboard />);
  </script>
</body>
</html>
