<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Pi PaaS - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- CDNs React & Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
  
  <!-- Tailwind CSS & FontAwesome pour les icônes modernes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            dark: { 800: '#121827', 900: '#0b0f17', 950: '#05070a' }
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen selection:bg-brand-500 selection:text-white flex flex-col">
  <div id="root" class="flex flex-col min-h-screen"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;

    const STATUS_META = {
      running: { color: "bg-emerald-500", text: "text-emerald-400", border: "border-emerald-500/30", bg: "bg-emerald-500/10", label: "En ligne" },
      stopped: { color: "bg-slate-500", text: "text-slate-400", border: "border-slate-500/30", bg: "bg-slate-500/10", label: "Arrêté" },
      error: { color: "bg-rose-500", text: "text-rose-400", border: "border-rose-500/30", bg: "bg-rose-500/10", label: "Erreur" },
      deploying: { color: "bg-amber-500", text: "text-amber-400", border: "border-amber-500/30", bg: "bg-amber-500/10", label: "Déploiement" },
    };

    const emptyForm = { name: "", repo_url: "", branch: "main", start_command: "", port: "", autoupdate: true };

    function PiPaasDashboard() {
      const [apiInput, setApiInput] = useState("http://192.168.1.10:8000");
      const [apiBase, setApiBase] = useState("");
      const [connected, setConnected] = useState(false);
      const [connecting, setConnecting] = useState(false);
      const [connectError, setConnectError] = useState("");
      const [projects, setProjects] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [logs, setLogs] = useState("");
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState(emptyForm);
      const [formError, setFormError] = useState("");
      const [busy, setBusy] = useState(false);
      const [envRows, setEnvRows] = useState([]);
      const [envSaved, setEnvSaved] = useState(true);
      const [showEnvValues, setShowEnvValues] = useState(false);
      const logsRef = useRef(null);

      const selected = projects.find((p) => p.id === selectedId) || null;

      const fetchProjects = useCallback(async (base) => {
        try {
          const res = await fetch(`${base}/projects`);
          if (!res.ok) throw new Error("bad response");
          const data = await res.json();
          setProjects(data);
          setConnected(true);
          setConnectError("");
          return data;
        } catch (e) {
          setConnected(false);
          setConnectError("Impossible de joindre le backend à cette adresse.");
          return null;
        }
      }, []);

      const fetchLogs = useCallback(async (base, id) => {
        try {
          const res = await fetch(`${base}/projects/${id}/logs?lines=200`);
          const text = await res.text();
          setLogs(text);
        } catch (e) {
          setLogs("Impossible de récupérer les logs.");
        }
      }, []);

      useEffect(() => {
        if (!connected || !apiBase) return;
        const interval = setInterval(() => fetchProjects(apiBase), 8000);
        return () => clearInterval(interval);
      }, [connected, apiBase, fetchProjects]);

      useEffect(() => {
        if (selected && connected) {
          fetchLogs(apiBase, selected.id);
          const interval = setInterval(() => fetchLogs(apiBase, selected.id), 5000);
          return () => clearInterval(interval);
        }
      }, [selected?.id, connected, apiBase, fetchLogs]);

      useEffect(() => {
        if (selected) {
          setEnvRows(Object.entries(selected.env_vars || {}).map(([key, value]) => ({ key, value })));
          setEnvSaved(true);
        }
      }, [selected?.id]);

      useEffect(() => {
        if (logsRef.current) logsRef.current.scrollTop = logsRef.current.scrollHeight;
      }, [logs]);

      async function handleConnect() {
        setConnecting(true);
        const base = apiInput.replace(/\/$/, "");
        const data = await fetchProjects(base);
        setApiBase(base);
        if (data && data.length > 0 && !selectedId) setSelectedId(data[0].id);
        setConnecting(false);
      }

      async function handleCreate(e) {
        e.preventDefault();
        setFormError("");
        if (!form.name || !form.repo_url || !form.start_command || !form.port) {
          setFormError("Tous les champs sauf la branche sont requis.");
          return;
        }
        setBusy(true);
        try {
          const res = await fetch(`${apiBase}/projects`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...form, port: parseInt(form.port, 10) }),
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Échec de la création");
          }
          const created = await res.json();
          await fetchProjects(apiBase);
          setSelectedId(created.id);
          setShowForm(false);
          setForm(emptyForm);
        } catch (err) {
          setFormError(err.message);
        } finally {
          setBusy(false);
        }
      }

      async function handleAction(action) {
        if (!selected) return;
        setBusy(true);
        try {
          await fetch(`${apiBase}/projects/${selected.id}/${action}`, { method: "POST" });
          await fetchProjects(apiBase);
          if (action === "deploy") await fetchLogs(apiBase, selected.id);
        } finally {
          setBusy(false);
        }
      }

      async function handleDelete() {
        if (!selected) return;
        setBusy(true);
        try {
          await fetch(`${apiBase}/projects/${selected.id}`, { method: "DELETE" });
          setSelectedId(null);
          await fetchProjects(apiBase);
        } finally {
          setBusy(false);
        }
      }

      function updateEnvRow(i, field, value) {
        const next = [...envRows];
        next[i] = { ...next[i], [field]: value };
        setEnvRows(next);
        setEnvSaved(false);
      }
      function addEnvRow() { setEnvRows([...envRows, { key: "", value: "" }]); setEnvSaved(false); }
      function removeEnvRow(i) { setEnvRows(envRows.filter((_, idx) => idx !== i)); setEnvSaved(false); }

      async function saveEnvVars() {
        if (!selected) return;
        const env_vars = {};
        envRows.forEach((row) => { if (row.key) env_vars[row.key] = row.value; });
        setBusy(true);
        try {
          await fetch(`${apiBase}/projects/${selected.id}/env`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ env_vars }),
          });
          await fetchProjects(apiBase);
          setEnvSaved(true);
        } finally {
          setBusy(false);
        }
      }

      return (
        <div class="flex flex-col flex-1 min-h-screen">
          {/* Navigation Barre Haute */}
          <header class="border-b border-slate-800/80 bg-dark-900/60 backdrop-blur-md sticky top-0 z-40 px-6 py-3 flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-microchip text-white text-base"></i>
              </div>
              <span class="font-bold text-lg tracking-wide text-white">
                Pi PaaS <span class="text-xs text-brand-500 font-mono px-2 py-0.5 rounded-full bg-brand-500/10 border border-brand-500/20">v0.1.0</span>
              </span>
            </div>

            <div class="flex items-center gap-2">
              <span class={`w-2.5 h-2.5 rounded-full ${connected ? 'bg-emerald-500 animate-pulse' : 'bg-slate-600'}`}></span>
              <input 
                type="text" 
                value={apiInput} 
                onChange={(e) => setApiInput(e.target.value)} 
                placeholder="http://192.168.1.10:8000"
                class="bg-dark-950 border border-slate-800 text-slate-200 text-xs font-mono rounded-lg px-3 py-1.5 w-60 focus:outline-none focus:border-brand-500 transition"
              />
              <button 
                onClick={handleConnect} 
                disabled={connecting}
                class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-md shadow-brand-600/20"
              >
                {connecting ? <i class="fa-solid fa-spinner animate-spin"></i> : <i class="fa-solid fa-plug"></i>}
                {connecting ? "..." : connected ? "Reconnecter" : "Connecter"}
              </button>
            </div>
          </header>

          {connectError && !connected && (
            <div class="bg-rose-500/10 border-b border-rose-500/20 text-rose-400 text-xs px-6 py-2.5 text-center font-mono flex items-center justify-center gap-2">
              <i class="fa-solid fa-triangle-exclamation"></i> {connectError}
            </div>
          )}

          {/* Contenu Principal */}
          <div class="flex flex-1 min-h-0">
            {/* Sidebar Projets */}
            <aside class="w-64 border-r border-slate-800/80 bg-dark-900/30 p-4 flex flex-col shrink-0">
              <div class="flex items-center justify-between pb-4 border-b border-slate-800/60 mb-3">
                <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Projets</span>
                <button 
                  onClick={() => { setShowForm(true); setFormError(""); }}
                  class="w-7 h-7 bg-brand-600/20 border border-brand-500/30 text-brand-400 hover:bg-brand-600 hover:text-white rounded-lg flex items-center justify-center transition"
                  title="Ajouter un projet"
                >
                  <i class="fa-solid fa-plus text-xs"></i>
                </button>
              </div>

              {!connected && <p class="text-xs text-slate-500 py-4 text-center">Connecte-toi à ton Pi pour charger la liste.</p>}
              {connected && projects.length === 0 && (
                <p class="text-xs text-slate-500 py-4 text-center">Aucun projet configuré.</p>
              )}

              <div class="space-y-1.5 overflow-y-auto">
                {projects.map((p) => {
                  const meta = STATUS_META[p.status] || STATUS_META.stopped;
                  const isSelected = p.id === selectedId;
                  return (
                    <button
                      key={p.id}
                      onClick={() => setSelectedId(p.id)}
                      class={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-medium transition text-left ${
                        isSelected 
                          ? 'bg-brand-600/15 border border-brand-500/30 text-white shadow-sm' 
                          : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200 border border-transparent'
                      }`}
                    >
                      <span class={`w-2 h-2 rounded-full ${meta.color}`}></span>
                      <span class="truncate flex-1">{p.name}</span>
                      {p.exposed && <i class="fa-solid fa-globe text-emerald-400 text-[10px]" title="Exposé"></i>}
                      <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                    </button>
                  );
                })}
              </div>
            </aside>

            {/* Zone de Vue Détaillée */}
            <main class="flex-1 p-8 overflow-y-auto">
              {!selected && (
                <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center">
                    <i class="fa-solid fa-server text-slate-600 text-xl"></i>
                  </div>
                  <p class="text-sm max-w-xs">
                    {connected ? "Sélectionne un projet à gauche pour afficher ses détails." : "Renseigne l'URL de ton API et connecte-toi."}
                  </p>
                </div>
              )}

              {selected && (
                <div class="space-y-6 max-w-5xl mx-auto">
                  {/* Header Projet */}
                  <div class="flex items-start justify-between flex-wrap gap-4 border-b border-slate-800/80 pb-6">
                    <div>
                      <h1 class="text-2xl font-bold text-white tracking-tight">{selected.name}</h1>
                      <div class="flex items-center gap-3 mt-2 text-xs text-slate-400 font-mono">
                        <span class="flex items-center gap-1"><i class="fa-solid fa-code-branch text-brand-400"></i> {selected.branch}</span>
                        <span>•</span>
                        <span>Port {selected.port}</span>
                        <span>•</span>
                        <span class="bg-slate-800/80 text-slate-300 px-2 py-0.5 rounded">
                          {selected.last_commit ? selected.last_commit.slice(0, 7) : "Non déployé"}
                        </span>
                      </div>
                    </div>

                    <div class="flex items-center gap-2">
                      {(() => {
                        const meta = STATUS_META[selected.status] || STATUS_META.stopped;
                        return (
                          <div class={`px-3 py-1 rounded-full text-xs font-semibold border flex items-center gap-2 ${meta.bg} ${meta.text} ${meta.border}`}>
                            <span class={`w-2 h-2 rounded-full ${meta.color}`}></span>
                            {meta.label}
                          </div>
                        );
                      })()}

                      {selected.exposed && (
                        <div class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
                          <i class="fa-solid fa-globe text-[11px]"></i> Public
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Boutons d'Action */}
                  <div class="flex flex-wrap items-center gap-3">
                    <button 
                      onClick={() => handleAction("deploy")} 
                      disabled={busy}
                      class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-brand-600/20 flex items-center gap-2 disabled:opacity-50"
                    >
                      <i class="fa-solid fa-rotate mr-1"></i> Déployer
                    </button>

                    <button 
                      onClick={() => handleAction("stop")} 
                      disabled={busy || selected.status === "stopped"}
                      class="px-4 py-2 bg-slate-800/80 hover:bg-slate-800 border border-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-2 disabled:opacity-50"
                    >
                      <i class="fa-solid fa-stop text-amber-400"></i> Arrêter
                    </button>

                    {selected.exposed ? (
                      <button 
                        onClick={() => handleAction("unexpose")} 
                        disabled={busy}
                        class="px-4 py-2 bg-slate-800/80 hover:bg-slate-800 border border-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-2 disabled:opacity-50"
                      >
                        <i class="fa-solid fa-eye-slash text-slate-400"></i> Masquer du proxy
                      </button>
                    ) : (
                      <button 
                        onClick={() => handleAction("expose")} 
                        disabled={busy || selected.status !== "running"}
                        class="px-4 py-2 bg-slate-800/80 hover:bg-slate-800 border border-slate-700 text-slate-200 rounded-xl text-xs font-semibold transition flex items-center gap-2 disabled:opacity-50"
                      >
                        <i class="fa-solid fa-globe text-emerald-400"></i> Exposer publiquement
                      </button>
                    )}

                    <button 
                      onClick={handleDelete} 
                      disabled={busy}
                      class="ml-auto px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 rounded-xl text-xs font-semibold transition flex items-center gap-2 disabled:opacity-50"
                    >
                      <i class="fa-solid fa-trash"></i> Supprimer
                    </button>
                  </div>

                  {/* Métadonnées (Repo & Command) */}
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-4 rounded-xl bg-dark-900/50 border border-slate-800/80">
                      <p class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Dépôt Git</p>
                      <p class="text-xs font-mono text-brand-400 truncate">{selected.repo_url}</p>
                    </div>

                    <div class="p-4 rounded-xl bg-dark-900/50 border border-slate-800/80">
                      <p class="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Commande de Démarrage</p>
                      <p class="text-xs font-mono text-slate-200 bg-dark-950 p-2 rounded-lg border border-slate-800">{selected.start_command}</p>
                    </div>
                  </div>

                  {/* Variables d'Environnement */}
                  <div class="p-5 rounded-2xl bg-dark-900/40 border border-slate-800/80 space-y-4">
                    <div class="flex items-center justify-between">
                      <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-brand-500"></i> Variables d'environnement
                      </h3>
                      <div class="flex items-center gap-2">
                        <button 
                          onClick={() => setShowEnvValues(!showEnvValues)} 
                          class="p-1.5 text-xs text-slate-400 hover:text-slate-200 transition"
                          title="Afficher/Masquer les valeurs"
                        >
                          <i class={`fa-solid ${showEnvValues ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                        </button>
                        <button 
                          onClick={addEnvRow} 
                          class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 rounded-lg transition"
                        >
                          <i class="fa-solid fa-plus mr-1"></i> Ajouter
                        </button>
                      </div>
                    </div>

                    {envRows.length === 0 && <p class="text-xs text-slate-500 font-mono">Aucune variable définie pour le moment.</p>}

                    <div class="space-y-2">
                      {envRows.map((row, i) => (
                        <div key={i} class="flex items-center gap-2">
                          <input 
                            type="text" 
                            value={row.key} 
                            onChange={(e) => updateEnvRow(i, "key", e.target.value)} 
                            placeholder="CLE" 
                            class="bg-dark-950 border border-slate-800 text-brand-400 text-xs font-mono rounded-lg px-3 py-2 w-1/3 focus:outline-none focus:border-brand-500"
                          />
                          <input 
                            type={showEnvValues ? "text" : "password"} 
                            value={row.value} 
                            onChange={(e) => updateEnvRow(i, "value", e.target.value)} 
                            placeholder="valeur" 
                            class="bg-dark-950 border border-slate-800 text-slate-200 text-xs font-mono rounded-lg px-3 py-2 flex-1 focus:outline-none focus:border-brand-500"
                          />
                          <button onClick={() => removeEnvRow(i)} class="p-2 text-slate-500 hover:text-rose-400 transition">
                            <i class="fa-solid fa-xmark"></i>
                          </button>
                        </div>
                      ))}
                    </div>

                    {envRows.length > 0 && (
                      <button 
                        onClick={saveEnvVars} 
                        disabled={envSaved || busy}
                        class={`mt-2 px-4 py-2 text-xs font-semibold rounded-xl transition ${
                          envSaved 
                            ? 'bg-slate-800/40 text-slate-500 cursor-default' 
                            : 'bg-brand-600 hover:bg-brand-500 text-white shadow-lg shadow-brand-600/20'
                        }`}
                      >
                        {envSaved ? "Enregistré" : "Sauvegarder les variables"}
                      </button>
                    )}
                  </div>

                  {/* Moduel de Logs Console */}
                  <div class="p-5 rounded-2xl bg-dark-950 border border-slate-800/80 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-2 font-mono">
                        <i class="fa-solid fa-terminal text-brand-500"></i> Logs d'exécution
                      </span>
                      <button onClick={() => fetchLogs(apiBase, selected.id)} class="text-xs text-slate-400 hover:text-slate-200 transition">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Actualiser
                      </button>
                    </div>
                    <div ref={logsRef} class="h-64 overflow-y-auto font-mono text-xs text-slate-300 leading-relaxed whitespace-pre-wrap bg-dark-900/60 p-4 rounded-xl border border-slate-800/50">
                      {logs || "Aucun log à afficher pour l'instant."}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Modale de Création de Projet */}
          {showForm && (
            <div class="fixed inset-0 bg-dark-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setShowForm(false)}>
              <div class="bg-dark-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative" onClick={(e) => e.stopPropagation()}>
                <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                  <h3 class="text-base font-bold text-white">Nouveau projet</h3>
                  <button onClick={() => setShowForm(false)} class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleCreate} class="space-y-4 text-xs">
                  <div>
                    <label class="block text-slate-300 mb-1">Nom du projet</label>
                    <input 
                      type="text" 
                      value={form.name} 
                      onChange={(e) => setForm({ ...form, name: e.target.value })} 
                      placeholder="mon-site" 
                      class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-200 font-mono focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label class="block text-slate-300 mb-1">URL du dépôt GitHub</label>
                    <input 
                      type="text" 
                      value={form.repo_url} 
                      onChange={(e) => setForm({ ...form, repo_url: e.target.value })} 
                      placeholder="https://github.com/user/repo.git" 
                      class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-200 font-mono focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-slate-300 mb-1">Branche</label>
                      <input 
                        type="text" 
                        value={form.branch} 
                        onChange={(e) => setForm({ ...form, branch: e.target.value })} 
                        class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-200 font-mono focus:outline-none focus:border-brand-500"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-300 mb-1">Port</label>
                      <input 
                        type="text" 
                        value={form.port} 
                        onChange={(e) => setForm({ ...form, port: e.target.value })} 
                        placeholder="8001" 
                        class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-200 font-mono focus:outline-none focus:border-brand-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block text-slate-300 mb-1">Commande de démarrage</label>
                    <input 
                      type="text" 
                      value={form.start_command} 
                      onChange={(e) => setForm({ ...form, start_command: e.target.value })} 
                      placeholder="python3 main.py" 
                      class="w-full bg-dark-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-200 font-mono focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <label class="flex items-center gap-2 cursor-pointer pt-1">
                    <input 
                      type="checkbox" 
                      checked={form.autoupdate} 
                      onChange={(e) => setForm({ ...form, autoupdate: e.target.checked })} 
                      class="rounded bg-dark-950 border-slate-800 text-brand-600 focus:ring-0"
                    />
                    <span class="text-slate-400">Redéployer automatiquement sur chaque push</span>
                  </label>

                  {formError && <p class="text-rose-400 text-xs font-mono">{formError}</p>}

                  <button 
                    type="submit" 
                    disabled={busy} 
                    class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl text-xs transition shadow-lg shadow-brand-600/20 mt-2"
                  >
                    Cloner et ajouter
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PiPaasDashboard />);
  </script>
</body>
</html>
